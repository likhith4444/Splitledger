spring:
  application:
    name: splitledger
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/splitledger?useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:splitledger}
    password: ${DB_PASSWORD:splitledger}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  sql:
    init:
      mode: always

management:
  endpoints:
    web:
      exposure:
        include: health