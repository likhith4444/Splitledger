spring:
  application:
    name: splitledger
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/splitledger?useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:splitledger}
    password: ${DB_PASSWORD:splitledger}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  sql:
    init:
      mode: always

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-please-change-in-production-0123456789}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}