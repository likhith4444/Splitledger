services:
  mysql:
    image: mysql:8.4
    container_name: splitledger-mysql
    environment:
      MYSQL_DATABASE: splitledger
      MYSQL_USER: splitledger
      MYSQL_PASSWORD: splitledger
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-usplitledger", "-psplitledger"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data: